<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transformaciones 2D y 3D</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="encabezado">
      <h1>Transformaciones 2D y 3D con CSS</h1>
      <p>Práctica CSS Avanzado</p>
    </header>

    <main class="contenido">
      <section class="bloque">
        <h2>Ejercicio 1: Transformaciones 2D</h2>
        <div class="container">
          <div class="box">Rotar</div>
          <div class="box">Mover</div>
          <div class="box">Escalar</div>
          <div class="box">Sesgar</div>
        </div>
      </section>

      <section class="bloque bloque-3d">
        <h2>Ejercicio 2: Transformaciones 3D</h2>
        <div class="contenedor">
          <div class="cubo">
            <div class="cara frente">Frente</div>
            <div class="cara atras">Atrás</div>
            <div class="cara izquierda">Izquierda</div>
            <div class="cara derecha">Derecha</div>
            <div class="cara arriba">Arriba</div>
            <div class="cara abajo">Abajo</div>
          </div>
        </div>
      </section>

      <section class="bloque bloque-personalizado">
        <h2>Ejercicio 3: Figura personalizada</h2>
        <div class="escena-personalizada">
          <div
            class="figura-personalizada"
            tabindex="0"
            aria-label="Figura personalizada con imagen central y transformaciones 2D y 3D"
          >
            <div class="cara-personalizada frente-personalizada">
              <img src="img/foto-adrian.png" alt="Imagen central del ejercicio personalizado" />
            </div>
            <div class="cara-personalizada atras-personalizada">
              <div class="texto-atras">
                <span>2D + 3D</span>
                <small>Transformaciones con CSS</small>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="pie">
      <p>Autor: Chilete DevPath</p>
    </footer>
  </body>
</html>
